name: Odkazy

# Katalog odkazů tiše hnije: weby se stěhují, služby se ruší, certifikáty
# vyprší. Nikdo si toho nevšimne, dokud na odkaz někdo neklikne. Proto
# měsíční kontrola, která při nálezu založí issue.
on:
  schedule:
    - cron: '0 6 1 * *'   # 1. den v měsíci, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Kontrola odkazů
        id: links
        run: |
          set +e
          python3 tools/check_links.py > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Založit issue při nálezu
        if: steps.links.outputs.status != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const report = fs.readFileSync('report.txt', 'utf8')
            const title = 'Nefunkční odkazy v katalogu'
            const body = [
              'Měsíční kontrola `tools/check_links.py` našla odkazy, které nikam nevedou.',
              '',
              'Přesměrování a weby blokující automat nejsou chyba — opravují se jen položky',
              'označené `✗`. Zdrojem pravdy jsou `data/sources/*.json`, ne `data/catalog.csv`:',
              'ten se z nich generuje.',
              '',
              'Sekce „Declared anti-bot" vypisuje zdroje s `check: anti-bot` ve zdrojových',
              'datech. U nich se checker na měření nespoléhá — projdi je ručně, protože jinak',
              'by se nepoznalo, že takový web skutečně zemřel.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')

            // Nezakládat druhé issue ke stejné věci — jen doplnit komentář.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'odkazy',
            })
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['odkazy'],
              })
            }
