name: Pages

# Stránka se staví z committnutých CSV v data/. Datový řetěz nad Chrome
# profilem běží jen lokálně — v CI k němu není přístup ani důvod.
on:
  push:
    branches: [main]
    paths: ['data/**', 'src/**', 'tools/**', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Rozestavěný deploy se nepřerušuje, jinak by Pages zůstaly v půli.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Kurátorovaná data
        run: |
          python3 tools/validate_sources.py
          python3 tools/build_catalog.py

      - name: Build
        run: |
          python3 tools/build_page.py
          python3 tools/build_places.py

      - name: Konvence UI
        run: |
          python3 tools/lint_ui.py
          python3 tools/check_runtime_classes.py

      - name: Responzivita a přístupnost
        run: |
          python3 tools/check_responsive.py
          python3 tools/check_responsive.py --page place
          python3 tools/check_typography.py
          python3 tools/check_typography.py --page place
          python3 tools/check_a11y.py
          python3 tools/check_a11y.py --page place

      - name: Test
        run: |
          node tests/smoke.mjs
          node tests/interact.mjs
          node tests/meta.mjs
          node tests/flowbite.mjs
          node tests/places.mjs

      # Proklik v opravdovém prohlížeči. Bere se Chrome z runneru
      # (`--only-shell` nestačí, config jede na channel: 'chrome'),
      # takže se nestahuje celý Chromium.
      - name: Proklik v prohlížeči
        run: |
          npx playwright install --with-deps chrome
          npx playwright test

      - uses: actions/configure-pages@v6
      # include-hidden-files, protože v5 nově vylučuje všechny tečkové soubory
      # (v3 vylučovala jen .git a .github). Bez toho by z artefaktu tiše
      # vypadl `dist/.nojekyll`, který build schválně generuje.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
