name: Pages

# Stránka se staví z committnutých CSV v data/. Datový řetěz nad Chrome
# profilem běží jen lokálně — v CI k němu není přístup ani důvod.
on:
  push:
    branches: [main]
    paths: ['data/**', 'src/**', 'tools/**', 'static/**', 'tests/**', 'package*.json',
            'justfile', '.gitattributes', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Rozestavěný deploy se nepřerušuje, jinak by Pages zůstaly v půli.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Instalace just
        run: |
          curl -fsSL -o just.tar.gz \
            https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
          echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  just.tar.gz" | sha256sum -c -
          sudo tar -xzf just.tar.gz -C /usr/local/bin just
          rm just.tar.gz

      # Proklik v opravdovém prohlížeči. Bere se Chrome z runneru
      # (`--only-shell` nestačí, config jede na channel: 'chrome'),
      # takže se nestahuje celý Chromium.
      - name: Chrome pro Playwright
        run: npx playwright install --with-deps chrome

      # Staví dist/ a projde všemi kontrolami — týmiž, co v ci.yml, protože
      # obojí je `just check`. Nasazuje se jen to, co prošlo.
      - name: just check
        run: just check

      # ci.yml běží jen mimo main (branches-ignore), takže přímý push do main
      # by se jinak nasadil bez jediné kontroly, že generované soubory sedí.
      - name: Generované soubory jsou committnuté
        run: |
          git diff --exit-code data/catalog.csv \
            || { echo "::error::data/catalog.csv neodpovídá data/sources/*.json — spusť 'just catalog' a commitni výsledek"; exit 1; }
          git diff --exit-code docs/CATALOG.md docs/COVERAGE.md \
            || { echo "::error::docs/ neodpovídá data/catalog.csv — spusť 'just docs' a commitni výsledek"; exit 1; }

      - uses: actions/configure-pages@v6
      # include-hidden-files, protože v5 nově vylučuje všechny tečkové soubory
      # (v3 vylučovala jen .git a .github). Bez toho by z artefaktu tiše
      # vypadl `dist/.nojekyll`, který build schválně generuje.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
