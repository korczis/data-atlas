name: Pages

# Stránka se staví z committnutých CSV v data/. Datový řetěz nad Chrome
# profilem běží jen lokálně — v CI k němu není přístup ani důvod.
on:
  push:
    branches: [main]
    paths: ['data/**', 'src/**', 'tools/**', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Rozestavěný deploy se nepřerušuje, jinak by Pages zůstaly v půli.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Build
        run: python3 tools/build_page.py

      - name: Test
        run: |
          node tests/smoke.mjs
          node tests/interact.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
