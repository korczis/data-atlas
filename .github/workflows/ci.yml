name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Kurátorovaná data
        run: |
          python3 tools/validate_sources.py
          python3 tools/build_catalog.py
          git diff --exit-code data/catalog.csv \
            || { echo "::error::data/catalog.csv neodpovídá data/sources/*.json — spusť 'just catalog'"; exit 1; }

      - name: Build a testy
        run: |
          python3 tools/build_page.py
          python3 tools/lint_ui.py
          python3 tools/check_responsive.py
          python3 tools/check_a11y.py
          node tests/smoke.mjs
          node tests/interact.mjs
          node tests/meta.mjs
          node tests/flowbite.mjs

      - name: Dokumentace je aktuální
        run: |
          python3 tools/build_docs.py
          git diff --exit-code docs/CATALOG.md docs/COVERAGE.md \
            || { echo "::error::docs/ neodpovídá data/catalog.csv — spusť 'just docs'"; exit 1; }
