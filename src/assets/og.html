<!doctype html><meta charset="utf-8">
<style>
  @page { margin: 0 }
  html,body { margin:0; padding:0; width:1200px; height:630px; overflow:hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1d4ed8 0%, #0f2a6b 55%, #0a1f4f 100%);
    color: #fff; position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 76px; box-sizing: border-box;
  }
  /* mřížka dlaždic jako podklad — stejný motiv jako ikona, jen rozpitý */
  .grid { position:absolute; inset:0; opacity:.16;
    background-image:
      linear-gradient(#93c5fd 1.5px, transparent 1.5px),
      linear-gradient(90deg, #93c5fd 1.5px, transparent 1.5px);
    background-size: 84px 84px; }
  .cell { position:absolute; right:118px; top:196px; width:168px; height:168px;
          border-radius:26px; background:#fff; box-shadow:0 24px 70px rgba(0,0,0,.35);
          display:flex; align-items:center; justify-content:center; }
  .cell i { width:56px; height:56px; border-radius:50%; background:#1d4ed8; display:block; }
  .wrap { position:relative; max-width:660px; }
  .eyebrow { font-size:21px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
             color:#93c5fd; margin:0 0 22px; }
  h1 { font-size:82px; line-height:1.02; letter-spacing:-.03em; margin:0 0 24px; font-weight:800; }
  p  { font-size:28px; line-height:1.45; margin:0 0 40px; color:#dbeafe; font-weight:400; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; }
  .stat { background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.22);
          border-radius:12px; padding:12px 20px; font-size:23px; font-weight:600; }
  .stat b { font-variant-numeric: tabular-nums; }
  .url { position:absolute; left:76px; bottom:52px; font-size:22px; color:#93c5fd;
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<div class="grid"></div>
<div class="cell"><i></i></div>
<div class="wrap">
  <p class="eyebrow">Geodata · Registry · OSINT · Due diligence</p>
  <h1>Data&nbsp;Atlas</h1>
  <p>Katastr, doprava, statistika, obchodní rejstříky, insolvence, zakázky a rizika — všech 27 států EU na jedné prohledávatelné stránce.</p>
  <div class="stats">
    <span class="stat"><b>{{ITEMS}}</b> zdrojů</span>
    <span class="stat"><b>{{COUNTRIES}}</b> zemí a rozsahů</span>
    <span class="stat"><b>{{TOPICS}}</b> témat</span>
  </div>
</div>
<div class="url">korczis.github.io/geodata-atlas</div>
